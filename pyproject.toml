[project]
name = "alphaedge"
version = "1.0.0"
description = "Quantitative finance and portfolio optimization application"
requires-python = ">=3.14,<=3.14.7"

dependencies = [
    # Data manipulation
    "pandas>=3.0.5,<3.1.0",
    "numpy>=1.26.0",
    "PyYAML==6.0.3",

    # Data collection
    "yfinance>=0.2.32",
    "pandas-datareader>=0.10.0",

    # Machine Learning & Stats
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.2",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.0",
    "optuna>=3.6.0",
    "mlflow>=2.13.0",

    # Portfolio optimization
    "PyPortfolioOpt>=1.5.5",
    "scipy>=1.12.0",
    "cvxpy>=1.4.0",

    # Visualization
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",

    # Technical indicators
    "ta>=0.11.0",

    # Utilities
    "tqdm>=4.66.1",

    # Web App
    "streamlit>=1.30.0",
    "streamlit-autorefresh",

    # Hugging Face
    "huggingface_hub>=0.20.0",
    "datasets>=2.16.0",
    "pyarrow>=14.0.0",

    # Environment variables
    "python-dotenv>=1.0.0",
]

# ---------------------------------------------------------------------------
# Development tools (Notebooks, Linter, etc.)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.6",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
]

[tool.ruff.lint]
# On dit à Ruff de fermer les yeux sur ces erreurs spécifiques pour l'instant
ignore = [
    "BLE001",  # Les exceptions aveugles (except Exception)
    "DTZ",     # Les obligations de fuseaux horaires (datetime sans tz)
    "S110",    # Les try/except/pass silencieux
    "RUF013",  # Les types Optional implicites
    "RUF059",  # Les variables déballées mais non utilisées
    "B018"     # Les expressions inutiles (le fameux 'df' tout seul)
]